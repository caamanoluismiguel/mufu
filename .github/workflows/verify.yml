name: Verify MUFU archive
on:
  pull_request:
  push:
    branches: [main, codex/mufu-connected-archive]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run package
      - run: npm test
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mufu-browser-checks
          path: |
            output/
            test-results/
          retention-days: 7
